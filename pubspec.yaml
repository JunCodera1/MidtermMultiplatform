name: user_admin_app
description: App quản lý sản phẩm (phân hệ Admin) - Bài thi giữa kỳ Lập trình đa nền tảng

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # Image picker
  image_picker: ^1.1.2

  # State management
  provider: ^6.1.2

  # UI utilities
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
